name: Continuous Integration

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: "latest"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test --race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build

  release:
    name: Release
    needs: ["lint-frontend", "lint-backend", "test", "build"]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build:frontend
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-release:
    name: Android Filebrowser release
    needs: ["release"]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Build Filebrowser web UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build signed Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw 'ANDROID_KEYSTORE_BASE64 secret is required' }
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Unsupported release tag: $tag" }
          $version = $tag.Substring(1)
          $code = [int]$Matches[1] * 1000000 + [int]$Matches[2] * 1000 + [int]$Matches[3]
          if ($code -gt 2100000000) { throw 'Android version code overflow' }
          $manifest = 'android-app/AndroidManifest.xml'
          $xml = Get-Content $manifest -Raw
          $xml = $xml -replace 'android:versionCode="\d+"', "android:versionCode=`"$code`""
          $xml = $xml -replace 'android:versionName="[^"]+"', "android:versionName=`"$version`""
          Set-Content $manifest $xml -NoNewline
          git apply android-app/patches/four-character-passwords.patch
          $env:GOOS = 'android'
          $env:GOARCH = 'arm64'
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force android-app/lib/arm64-v8a,android-app/build,android-app/tools | Out-Null
          $sha = git rev-parse --short HEAD
          go build -trimpath -ldflags "-s -w -X github.com/filebrowser/filebrowser/v2/version.Version=$version -X github.com/filebrowser/filebrowser/v2/version.CommitSHA=$sha" -o android-app/lib/arm64-v8a/libfilebrowser.so .
          [IO.File]::WriteAllBytes('android-app/build/debug.keystore', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          Invoke-WebRequest 'https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip' -OutFile android-app/tools/kotlin.zip
          Expand-Archive android-app/tools/kotlin.zip -DestinationPath android-app/tools
          & .\android-app\build.cmd
          if ($LASTEXITCODE -ne 0) { throw "Android build failed: $LASTEXITCODE" }
          Copy-Item android-app/filebrowser-test.apk filebrowser-server-app-arm64.apk
      - name: Attach APK to Filebrowser release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' filebrowser-server-app-arm64.apk --clobber



